# Local API: docker compose up --build   ->   http://localhost:8000/docs
# First start downloads the release weights (95 MB) into the named volume and verifies their SHA-256.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: poultry-disease-api:1.0.0
    ports:
      - "8000:8000"
    environment:
      # Exact origins allowed to call the API from a browser (the Vite dev and preview servers by default).
      POULTRY_API_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
      POULTRY_API_MAX_UPLOAD_MB: "25"
    volumes:
      - weights:/home/app/.cache/poultry-disease
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  weights:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python package and API (lint, tests, parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[api,dev]"
      - run: ruff check .
      - run: ruff format --check .

      # Weights come from the GitHub Release, checked against the SHA-256 in the package and cached by it.
      # Without them (for example before the release exists) the weight-dependent parity tests are skipped.
      - name: Weights cache key
        id: weights
        run: echo "sha=$(python -c 'from poultry_disease.constants import WEIGHTS_SHA256; print(WEIGHTS_SHA256)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/poultry-disease
          key: weights-${{ steps.weights.outputs.sha }}
      - name: Fetch weights
        run: python scripts/fetch_weights.py || echo "::warning::Release weights not available; weight tests will be skipped"

      - run: pytest -rs

  web:
    name: Web app (lint, types, unit + parity tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Numbers shown in the app match results/
        run: npm run sync:results && git diff --exit-code -- src/data

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      - name: TF.js model shards (<= 4 MiB each)
        run: npm run check:model

      - name: TF.js parity on the committed model and fixtures (Node, WASM)
        run: npm run test:parity

      - run: npm run build

      - name: End-to-end (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f backend/Dockerfile -t poultry-disease-api:ci .
      - name: Image runs as a non-root user with CPU TensorFlow
        run: |
          test "$(docker run --rm poultry-disease-api:ci id -u)" = "10001"
          docker run --rm poultry-disease-api:ci python -c "import tensorflow as tf, poultry_api.main; print(tf.__version__)"
